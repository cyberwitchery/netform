name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  sbom:
    name: sbom
    uses: cyberwitchery/.github/.github/workflows/sbom.yml@64ffd6a08c3e9626a681c8be1c8ad056765f3b85 # main
    permissions:
      contents: read
    with:
      mode: release

  attest:
    name: attest
    needs: sbom
    uses: cyberwitchery/.github/.github/workflows/attest.yml@64ffd6a08c3e9626a681c8be1c8ad056765f3b85 # main
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      names: ${{ needs.sbom.outputs.names }}

  publish:
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RUSTFLAGS: "-C debuginfo=0"
      CARGO_TARGET_DIR: target/ci
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: doc build
        env:
          RUSTDOCFLAGS: "--cfg docsrs"
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo doc --workspace --all-features --no-deps

      - name: run tests
        run: cargo test --workspace --all-targets

      - name: download sbom
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: ${{ runner.temp }}/evidence

      - name: attach sbom to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ runner.temp }}/evidence/release/*.cdx.json

      - name: verify clean tree before publish
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      # Each step tolerates "already uploaded" so a re-tagged release can
      # complete the publishes that didn't make it on a previous run.
      - name: publish netform_ir
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p netform_ir --no-verify 2>&1) && rc=0 || rc=$?
          echo "$out"
          [ $rc -eq 0 ] || echo "$out" | grep -qE "already uploaded|already exists on crates\.io"

      - name: publish netform_dialects
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p netform_dialects --no-verify 2>&1) && rc=0 || rc=$?
          echo "$out"
          [ $rc -eq 0 ] || echo "$out" | grep -qE "already uploaded|already exists on crates\.io"

      - name: publish netform_diff
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p netform_diff --no-verify 2>&1) && rc=0 || rc=$?
          echo "$out"
          [ $rc -eq 0 ] || echo "$out" | grep -qE "already uploaded|already exists on crates\.io"

      - name: publish netform_cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          out=$(cargo publish -p netform_cli --no-verify 2>&1) && rc=0 || rc=$?
          echo "$out"
          [ $rc -eq 0 ] || echo "$out" | grep -qE "already uploaded|already exists on crates\.io"
